name: Dev Release

# 每次代码推送到主分支后，自动构建 APK 并发布到 Releases（滚动 "latest" 预发布）
on:
  push:
    branches:
      - main
      - master
      - dev
    paths-ignore:
      - ".github/workflows/**"
      - "**.md"
      - "version_map.json"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false
    env:
      FCL_KEYSTORE_PASSWORD: ${{ secrets.FCL_KEYSTORE_PASSWORD }}
      CURSE_API_KEY: ${{ secrets.CURSE_API_KEY }}
      OAUTH_API_KEY: ${{ secrets.OAUTH_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
          cache: "gradle"

      - name: Build ${{ matrix.arch }} .apk
        run: |
          chmod +x gradlew
          ./gradlew assemblerelease -Darch=${{ matrix.arch }} --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: FCL/build/outputs/apk/release/*.apk
          retention-days: 7

  release:
    name: Publish Rolling Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: apks

      - name: List downloaded APKs
        run: ls -lah apks

      - name: Generate release notes
        id: notes
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' FCL/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' FCL/build.gradle.kts | head -n 1)
          BUILD_TIME_UTC=$(date -u '+%Y-%m-%d %H:%M UTC')
          BRANCH=${GITHUB_REF#refs/heads/}
          COMMIT_SHORT=${GITHUB_SHA::7}
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "## 📝 本次版本介绍（v${VERSION_NAME} / versionCode ${VERSION_CODE}）" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "- 一键下载依赖修复「只下一个」bug：修复了依赖递归里的异常污染（某个依赖解析失败不会再让兄弟姐妹都被跳过）；新增三级版本选择策略（严格匹配→游戏版本宽松匹配→仅ModLoader兜底），确保声明的依赖尽量都能命中候选版本；清单弹窗底部自动显示「被忽略的 N 个依赖及其原因」，用户不会再误以为只下了一个" >> "$GITHUB_OUTPUT"
          echo "- 失败弹窗不再纠缠用户：失败提示增加第 3 个「跳过本次 / 不再提示」按钮，所有被跳过的失败项在当前 Adapter 生命周期内都不会再被加入失败列表；同时清单弹窗 / 冲突弹窗 / 失败弹窗 / 版本不匹配弹窗全部改为可取消(setCancelable=true)，按返回键可随时退出" >> "$GITHUB_OUTPUT"
          echo "- 中文化覆盖：新增的确认下载 / 冲突处理 / 失败重试 / 版本不匹配 整套文案全部补齐 values-zh 翻译（取消、下载、仅重试失败项、重新下载全部、跳过本次、删除旧版本后下载、保留双版本、仍要下载、取消下载等按钮一律中文）" >> "$GITHUB_OUTPUT"
          echo "- 一键下载依赖体验继续强化：现在会在清单里标注「⚠️ 游戏版本宽松匹配」的依赖；失败重试支持「只重试未跳过的」；本地 SHA1 命中直接跳过不占并发；深度上限从 4 提到 6 层，应对更长的依赖链" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "## 🔖 版本号" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "- **versionName**: \`${VERSION_NAME}\`" >> "$GITHUB_OUTPUT"
          echo "- **versionCode**: \`${VERSION_CODE}\`" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "## 🛠️ 构建信息" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "**构建时间**: ${BUILD_TIME_UTC}" >> "$GITHUB_OUTPUT"
          echo "**触发分支**: ${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "**最新提交**: ${COMMIT_SHORT}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### 最近提交记录" >> "$GITHUB_OUTPUT"
          git log --pretty=format:'- %h %s' -n 10 >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "> 此版本由 GitHub Actions 在推送代码后自动构建，可能不稳定。" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Delete previous rolling release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true

      - name: Create rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dev Build (latest)"
          body: ${{ steps.notes.outputs.body }}
          files: apks/*.apk
          prerelease: true
          make_latest: "false"
          token: ${{ secrets.GITHUB_TOKEN }}
