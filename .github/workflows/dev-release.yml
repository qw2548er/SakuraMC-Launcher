name: Dev Release

# 每次代码推送到主分支后，自动构建 APK 并发布到 Releases（滚动 "latest" 预发布）
on:
  push:
    branches:
      - main
      - master
      - dev
    paths-ignore:
      - ".github/workflows/**"
      - "**.md"
      - "version_map.json"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false
    env:
      FCL_KEYSTORE_PASSWORD: ${{ secrets.FCL_KEYSTORE_PASSWORD }}
      CURSE_API_KEY: ${{ secrets.CURSE_API_KEY }}
      OAUTH_API_KEY: ${{ secrets.OAUTH_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
          cache: "gradle"

      - name: Build ${{ matrix.arch }} .apk
        run: |
          chmod +x gradlew
          ./gradlew assemblerelease -Darch=${{ matrix.arch }} --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: FCL/build/outputs/apk/release/*.apk
          retention-days: 7

  release:
    name: Publish Rolling Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: apks

      - name: List downloaded APKs
        run: ls -lah apks

      - name: Generate release notes
        id: notes
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' FCL/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' FCL/build.gradle.kts | head -n 1)
          BUILD_TIME_UTC=$(date -u '+%Y-%m-%d %H:%M UTC')
          BRANCH=${GITHUB_REF#refs/heads/}
          COMMIT_SHORT=${GITHUB_SHA::7}
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "## 📝 本次版本介绍（v${VERSION_NAME} / versionCode ${VERSION_CODE}）" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "- 一键下载依赖升级：现在会同时下载「模组本体 + 递归前置依赖」，下载前展示清单与合计大小；检测到本地同 modId 已存在旧版本或多个版本时弹冲突提示；批量失败后支持只重试失败的文件" >> "$GITHUB_OUTPUT"
          echo "- 模组批量检查更新：更新每个 mod 新版本的同时，也会下载新版本对应声明的新递归前置依赖" >> "$GITHUB_OUTPUT"
          echo "- 模组版本匹配保护：一键下载前校验本体的游戏版本 + ModLoader 匹配度，不匹配时先弹风险警告" >> "$GITHUB_OUTPUT"
          echo "- 微软登录体验优化：当构建时未配置 OAUTH_API_KEY 或 Azure AD 返回客户端未注册时，弹人话提示，不再直接显示 AADSTS 英文 Trace" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "## 🔖 版本号" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "- **versionName**: \`${VERSION_NAME}\`" >> "$GITHUB_OUTPUT"
          echo "- **versionCode**: \`${VERSION_CODE}\`" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "## 🛠️ 构建信息" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "**构建时间**: ${BUILD_TIME_UTC}" >> "$GITHUB_OUTPUT"
          echo "**触发分支**: ${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "**最新提交**: ${COMMIT_SHORT}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### 最近提交记录" >> "$GITHUB_OUTPUT"
          git log --pretty=format:'- %h %s' -n 10 >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "> 此版本由 GitHub Actions 在推送代码后自动构建，可能不稳定。" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Delete previous rolling release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true

      - name: Create rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dev Build (latest)"
          body: ${{ steps.notes.outputs.body }}
          files: apks/*.apk
          prerelease: true
          make_latest: "false"
          token: ${{ secrets.GITHUB_TOKEN }}
