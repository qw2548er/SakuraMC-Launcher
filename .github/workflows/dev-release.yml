name: Dev Release

# 每次代码推送到主分支后，自动构建 APK 并发布到 Releases（滚动 "latest" 预发布）
on:
  push:
    branches:
      - main
      - master
      - dev
    paths-ignore:
      - ".github/workflows/**"
      - "**.md"
      - "version_map.json"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false
    env:
      FCL_KEYSTORE_PASSWORD: ${{ secrets.FCL_KEYSTORE_PASSWORD }}
      CURSE_API_KEY: ${{ secrets.CURSE_API_KEY }}
      OAUTH_API_KEY: ${{ secrets.OAUTH_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
          cache: "gradle"

      - name: Build ${{ matrix.arch }} .apk
        run: |
          chmod +x gradlew
          ./gradlew assemblerelease -Darch=${{ matrix.arch }} --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: FCL/build/outputs/apk/release/*.apk
          retention-days: 7

  release:
    name: Publish Rolling Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: apks

      - name: List downloaded APKs
        run: ls -lah apks

      - name: Generate release notes
        id: notes
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' FCL/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' FCL/build.gradle.kts | head -n 1)
          BUILD_TIME_UTC=$(date -u '+%Y-%m-%d %H:%M UTC')
          BRANCH=${GITHUB_REF#refs/heads/}
          COMMIT_SHORT=${GITHUB_SHA::7}
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "## 📝 本次版本介绍（v${VERSION_NAME} / versionCode ${VERSION_CODE}）" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "- 一键下载依赖加入「模组关联性强对标 + 无限深度扫描」：删除原有的 depth>8 深度保险，改成「全局 visitedAllIds + 同 id 直接合并树枝重复」防死递归，让模组内含模组再内含依赖这种树枝直插结构一插到底；OPTIONAL 依赖不再被丢弃，全部进入确认清单；依赖选择改为「严格对标→宽松对标→完全不匹配则仅做候选（不自动勾选）」，不再自动把错误游戏版本的依赖给用户装上；清单 Banner 顶部实时展示「扫描过 X 个模组节点 · 重复合并 Y 个 · 最深到第 N 层 · 命中 Z 个 · 未命中 W 个」" >> "$GITHUB_OUTPUT"
          echo "- 新增「用户二次确认勾选清单」：模组本体 / 必需依赖 = 锁定勾选；可选依赖 = 默认勾选允许取消；游戏版本未命中的兜底候选 = 不默认勾选，完全由用户决定。3 个按钮：「确认无误开始下载 / 仅下载必需 / 取消」，清单里每项带徽章【模组本体】【必须】【工具/前置】【可选】 + 「✅/⚠️/❌ 游戏版本命中情况」 + 本地 SHA1 命中标识" >> "$GITHUB_OUTPUT"
          echo "- 全局对标所有 MC 版本（不硬编码 26.x）：游戏版本对标从具体 MC 版本名取，支持精确字符串 + 归一化前缀（1.21 ↔ 1.21.0 / 26.1.2 ↔ 26.1.2.0 / 26.2 最新版均命中）；Release/Alpha/Beta 全部扫描不区分稳定性；未命中关联的依赖集中放在「未命中 Section」展示，类型、目标游戏版本、原因全部中文列出" >> "$GITHUB_OUTPUT"
          echo "- 中文化 & 按钮命名：新增「确认无误开始下载」「仅下载必需」「递归扫描…共 X 节点 合并 Y 到第 N 层」「✅ 精准匹配 / ⚠️ 宽松匹配 / ❌ 未命中」等中文文案；所有交互弹窗（含确认清单、冲突、失败、版本不匹配）均为可取消；升级 versionName=1.4.6 / versionCode=1326" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "## 🔖 版本号" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "- **versionName**: \`${VERSION_NAME}\`" >> "$GITHUB_OUTPUT"
          echo "- **versionCode**: \`${VERSION_CODE}\`" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "## 🛠️ 构建信息" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "**构建时间**: ${BUILD_TIME_UTC}" >> "$GITHUB_OUTPUT"
          echo "**触发分支**: ${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "**最新提交**: ${COMMIT_SHORT}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### 最近提交记录" >> "$GITHUB_OUTPUT"
          git log --pretty=format:'- %h %s' -n 10 >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "> 此版本由 GitHub Actions 在推送代码后自动构建，可能不稳定。" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Delete previous rolling release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true

      - name: Create rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dev Build (latest)"
          body: ${{ steps.notes.outputs.body }}
          files: apks/*.apk
          prerelease: true
          make_latest: "false"
          token: ${{ secrets.GITHUB_TOKEN }}
